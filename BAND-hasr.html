<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" role="img" aria-label="BAND">
  <path d="M10 7.5H25.5C33 7.5 37 11.1 37 17C37 20.2 35 22.6 31.2 24C35.7 25.2 38.5 28.1 38.5 32.2C38.5 38 33.9 41 25.5 41H10V7.5Z" stroke="#123654" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M16 13.5H25C29.2 13.5 31 14.7 31 17.5C31 20.4 29 21.8 25 21.8H16V13.5Z" fill="#14A89B"/>
  <path d="M16 27.2H25.5C30.1 27.2 32.2 28.5 32.2 31.5C32.2 34.4 30 35.6 25.5 35.6H16V27.2Z" fill="#14A89B"/>
  <path d="M6.5 44H41.5" stroke="#E5B45D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M12 41.5V44M18 42V44M24 41.5V44M30 42V44M36 41.5V44" stroke="#E5B45D" stroke-width="1.4" stroke-linecap="round"/>
</svg></div>
    <div><h1>BAND</h1><p>منصة الحصر الهندسي وإدارة الكميات</p></div>
  </div>
  <div class="top-actions">
    <div class="project-input"><label for="projectName">المشروع</label><input id="projectName" type="text" placeholder="اسم المشروع / الشقة" autocomplete="off"></div>
    <button class="btn ghost-dark" data-action="export-json" type="button">نسخة احتياطية</button>
    <button class="btn ghost-dark" data-action="import-json" type="button">استرجاع</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <button class="btn primary" data-action="print" type="button">طباعة / PDF</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="side-label">القائمة الرئيسية</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><strong>حفظ تلقائي محلي</strong>يتم حفظ البيانات على هذا المتصفح. استخدم النسخة الاحتياطية لنقلها لجهاز آخر.</div>
  </aside>
  <main class="content" id="content" aria-live="polite"></main>
</div>
<div class="footer-note">BAND — أداة مساعدة للحصر الهندسي. راجع الأبعاد والخصومات قبل اعتماد الكميات النهائية.</div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,10), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='miyar-engineering-takeoff-v1';
const modules=[
 {id:'home',label:'الرئيسية',icon:'⌂'},
 {id:'masonry',label:'حصر المباني',icon:'▦',group:'room'},
 {id:'plaster',label:'حصر المحارة',icon:'▤',group:'room'},
 {id:'paint',label:'حصر الدهانات',icon:'▧',group:'room'},
 {id:'floors',label:'الأرضيات',icon:'▥'},
 {id:'doorsWindows',label:'الأبواب والشبابيك',icon:'▣'},
 {id:'sanitary',label:'الأجهزة الصحية',icon:'♧'},
 {id:'stairs',label:'السلالم الرخام',icon:'▤'},
 {id:'facades',label:'الواجهات',icon:'▥'}
];
const defaultState=()=>({version:1,meta:{project:'',client:'',notes:''},rooms:[],floors:[],doorsWindows:[],sanitary:[],stairs:[],facades:[],ui:{active:'home',expandedRooms:[],expandedFacades:[]},editing:{}});
let S=defaultState(),toastTimer;
try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&typeof saved==='object'){S={...defaultState(),...saved,meta:{...defaultState().meta,...(saved.meta||{})},ui:{...defaultState().ui,...(saved.ui||{})},editing:{}};['rooms','floors','doorsWindows','sanitary','stairs','facades'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});S.ui.expandedRooms=Array.isArray(S.ui.expandedRooms)?S.ui.expandedRooms:[];S.ui.expandedFacades=Array.isArray(S.ui.expandedFacades)?S.ui.expandedFacades:[];}}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({...S,editing:{}}));}catch(e){showToast('تعذر الحفظ المحلي. صدّر نسخة احتياطية.',true)}}
function showToast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',2700)}
const n=v=>{const x=Number(String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،]/g,'.'));return Number.isFinite(x)?x:0};
const fmt=v=>Number.isFinite(v)?v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}):'0';
const m2=v=>fmt(v)+' م²', lm=v=>fmt(v)+' م طولي', unitLabel=u=>u==='m2'?'م²':u==='lm'?'م طولي':'عدد';
function pageTitle(id){return modules.find(x=>x.id===id)?.label||'BAND'}
function getStats(){let wall=0,open=0,ceil=0;S.rooms.forEach(r=>{const x=roomMath(r);wall+=x.net;open+=x.open;ceil+=x.ceiling});return {rooms:S.rooms.length,wall,open,ceil,floors:S.floors.reduce((a,r)=>a+floorArea(r),0),windows:S.doorsWindows.reduce((a,r)=>a+(n(r.qty)||0),0),sanitary:S.sanitary.reduce((a,r)=>a+n(r.qty),0),facades:S.facades.length}}
function nav(){ $('#nav').innerHTML=modules.map(m=>`<button type="button" class="nav-btn ${S.ui.active===m.id?'active':''}" data-action="navigate" data-module="${m.id}"><span class="ico">${m.icon}</span><span class="nav-text">${m.label}</span></button>`).join('') }
function head(id,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">BAND / ${id==='home'?'نظرة عامة':'الحصر والكميات'}</div><h2>${pageTitle(id)}</h2><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function btn(label,action,cls='btn',attrs=''){return `<button type="button" class="${cls}" data-action="${action}" ${attrs}>${label}</button>`}
function stat(label,value,sub=''){return `<div class="stat"><div class="stat-label">${label}</div><strong>${value}</strong>${sub?`<small>${sub}</small>`:''}</div>`}
function moduleCard(m,desc,meta,color,soft){return `<button class="module-card" style="--accent-color:${color};--accent-soft:${soft}" data-action="navigate" data-module="${m.id}" type="button"><span class="module-icon">${m.icon}</span><strong>${m.label}</strong><p>${desc}</p><span class="module-meta">${meta} <span aria-hidden="true">←</span></span></button>`}
function renderHome(){const st=getStats();return head('home','ابدأ باختيار بند الحصر، وأدخل المقاسات مرة واحدة لكل نوع عمل.')+`<div class="notice"><strong>طريقة الاستخدام:</strong> اختر بند الحصر من القائمة. في المباني والمحارة والدهانات، أضف الفراغات ثم عرّف كل حائط وفتحاته؛ تُحسب الخصومات تلقائيًا. بقية البنود لها نماذج مستقلة وتُحفظ تلقائيًا.</div><div class="stats">${stat('الفراغات الداخلية',st.rooms,'غرف ومطبخ وحمامات وغيرها')}${stat('صافي الحوائط',m2(Math.max(0,st.wall)),'بعد خصم الفتحات')}${stat('خصومات الفتحات',m2(st.open),'أبواب وشبابيك وفتحات')}${stat('مساحة الأرضيات',m2(st.floors),'حسب البنود المُدخلة')}</div><div class="card"><div class="card-head"><div><h3>بنود الحصر</h3><p>اختر البند الذي تريد العمل عليه</p></div><span class="pill">9 أقسام</span></div><div class="module-grid">${moduleCard(modules[1],'مساحات الحوائط الصافية بعد خصم الفتحات.','ابدأ الحصر','#b7791f','#fff4db')}${moduleCard(modules[2],'محارة الحوائط والأسقف مع خصومات كل فتحة.','إدخال المحارة','#1769aa','#e9f2fc')}${moduleCard(modules[3],'دهانات الحوائط والأسقف بالكميات الصافية.','إدخال الدهانات','#6b4eb5','#f1edfc')}${moduleCard(modules[4],'رخام أو سيراميك أو بلاط مع مساحة كل فراغ.','حصر الأرضيات','#167c72','#e7f7f3')}${moduleCard(modules[5],'أبواب وشبابيك ألوميتال أو خشب بالمقاس والعدد.','حصر الفتحات','#2764a6','#e9f2fc')}${moduleCard(modules[6],'تجميع الأجهزة الصحية حسب النوع والمكان.','حصر الأجهزة','#9a5b95','#f8edf7')}${moduleCard(modules[7],'درجات وقوائم ووزرات وتلابيس، بالمتر أو العدد.','حصر السلالم','#b7791f','#fff4db')}${moduleCard(modules[8],'محارة ودهان وحجر وسافيتو مع أكثر من تشطيب للواجهة.','حصر الواجهات','#167c72','#e7f7f3')}</div></div><div class="card"><div class="card-head"><div><h3>بيانات المشروع</h3><p>تظهر في التصدير والطباعة</p></div></div><div class="form-grid three"><div class="field"><label class="label">اسم المشروع</label><input data-meta="project" value="${esc(S.meta.project)}" placeholder="مثال: شقة الدور الثالث"></div><div class="field"><label class="label">المالك / العميل</label><input data-meta="client" value="${esc(S.meta.client)}" placeholder="اسم العميل (اختياري)"></div><div class="field"><label class="label">ملاحظات التقرير</label><input data-meta="notes" value="${esc(S.meta.notes)}" placeholder="ملاحظات عامة (اختياري)"></div></div><p class="hint">البيانات تُحفظ محليًا على هذا المتصفح. استخدم «نسخة احتياطية» لحفظ نسخة JSON قابلة للاسترجاع.</p></div>`}
function roomMath(r){let gross=0,open=0,net=0;for(const w of (r.walls||[])){const g=Math.max(0,n(w.width))*Math.max(0,n(w.height));let o=0;(w.openings||[]).forEach(a=>o+=Math.max(0,n(a.width))*Math.max(0,n(a.height))*Math.max(0,n(a.qty)));gross+=g;open+=o;net+=Math.max(0,g-o)}const ceiling=Math.max(0,n(r.length))*Math.max(0,n(r.width));return {gross,open,net,ceiling,total:net+ceiling,walls:(r.walls||[]).length}}
function roomQty(r,mod){const x=roomMath(r);return mod==='masonry'?x.net:x.net+x.ceiling}
function roomModule(id){const st=S.rooms.reduce((a,r)=>{const x=roomMath(r);a.walls+=x.walls;a.gross+=x.gross;a.open+=x.open;a.net+=x.net;a.ceiling+=x.ceiling;a.qty+=roomQty(r,id);return a},{walls:0,gross:0,open:0,net:0,ceiling:0,qty:0});const edit=S.editing.room?S.rooms.find(x=>x.id===S.editing.room):null;const roomTypes=['غرفة','ريسبشن','مطبخ','حمام','حمام رئيسي','ممر','بلكونة','مخزن','أخرى'];return head(id,id==='masonry'?'أضف الفراغات وقسّم كل فراغ إلى حوائط؛ مساحة الحائط تُخصم منها الفتحات المسجلة عليه.':id==='plaster'?'يُحسب صافي مساحة الحوائط بعد الخصم، مضافًا إليها مساحات الأسقف.':'يُحسب صافي مساحة الحوائط بعد الخصم، مضافًا إليها مساحات الأسقف.',btn('طباعة التقرير','print','btn dark'))+`<div class="stats">${stat('عدد الفراغات',S.rooms.length)}${stat('عدد الحوائط',st.walls)}${stat('خصومات الفتحات',m2(st.open))}${stat(id==='masonry'?'كمية المباني':'إجمالي المسطح',m2(st.qty),id==='masonry'?'صافي الحوائط فقط':'حوائط صافية + أسقف')}</div><div class="notice"><strong>تنبيه حسابي:</strong> مساحة كل حائط = العرض × الارتفاع − مجموع الفتحات عليه. المباني تعرض صافي الحوائط فقط؛ المحارة والدهانات تشمل صافي الحوائط + مساحة السقف (الطول × العرض).</div><section class="card"><div class="card-head"><div><h3>${edit?'تعديل بيانات الفراغ':'إضافة فراغ جديد'}</h3><p>أدخل الأبعاد بالمتر. تُنشأ أربعة حوائط افتراضية ويمكن تعديل كل حائط بعد الإضافة.</p></div>${edit?btn('إلغاء التعديل','cancel-room','btn sm'):''}</div><form id="roomForm"><div class="form-grid"><div class="field"><label class="label">اسم الفراغ</label><input name="name" required value="${esc(edit?.name||'')}" placeholder="مثال: غرفة نوم 1"></div><div class="field"><label class="label">نوع الفراغ</label><select name="type">${roomTypes.map(x=>`<option ${edit?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label">الطول (م)</label><input name="length" required type="number" min="0.01" step="0.01" value="${edit?esc(edit.length):''}" placeholder="4.00"></div><div class="field"><label class="label">العرض (م)</label><input name="width" required type="number" min="0.01" step="0.01" value="${edit?esc(edit.width):''}" placeholder="3.50"></div><div class="field"><label class="label">ارتفاع الفراغ (م)</label><input name="height" required type="number" min="0.01" step="0.01" value="${edit?esc(edit.height):'3.00'}" placeholder="3.00"></div></div><div class="form-actions"><button class="btn primary" type="submit">${edit?'حفظ بيانات الفراغ':'إضافة الفراغ'}</button></div></form></section><section class="card"><div class="card-head"><div><h3>الفراغات المسجلة</h3><p>افتح تفاصيل الفراغ لتعديل الحوائط والفتحات. البيانات مشتركة بين المباني والمحارة والدهانات.</p></div><span class="pill">${S.rooms.length} فراغ</span></div>${S.rooms.length?`<div class="row-list">${S.rooms.map(r=>{const x=roomMath(r),open=S.ui.expandedRooms.includes(r.id);return `<article class="item-card"><div class="item-top"><div class="item-title"><strong>${esc(r.name)} <span class="pill blue">${esc(r.type)}</span></strong><small>أبعاد الفراغ: ${fmt(r.length)} × ${fmt(r.width)} م · الارتفاع ${fmt(r.height)} م</small><div class="item-stats"><span class="tag">حوائط <strong>${x.walls}</strong></span><span class="tag">صافي الحوائط <strong>${m2(x.net)}</strong></span><span class="tag">خصم الفتحات <strong>${m2(x.open)}</strong></span><span class="tag">السقف <strong>${m2(x.ceiling)}</strong></span><span class="tag">${id==='masonry'?'مباني':'كمية البند'} <strong>${m2(roomQty(r,id))}</strong></span></div></div><div class="item-actions">${btn(open?'إخفاء التفاصيل':'الحوائط والفتحات','toggle-room','btn sm','data-id="'+r.id+'"')}${btn('تعديل الفراغ','edit-room','btn sm','data-id="'+r.id+'"')}${btn('حذف','delete-room','btn sm danger','data-id="'+r.id+'"')}</div></div>${open?renderRoomDetails(r):''}</article>`}).join('')}</div>`:`<div class="empty"><span class="emoji">▦</span>لم تُضف أي فراغات بعد. ابدأ بالغرف والحمامات والمطبخ.</div>`}</section>`}
function renderRoomDetails(r){const walls=r.walls||[];return `<div class="details"><div class="subhead"><h4>حوائط ${esc(r.name)}</h4><button class="btn sm" data-action="add-wall" data-room="${r.id}">+ إضافة حائط</button></div><div class="wall-grid">${walls.map((w,wi)=>{const gross=n(w.width)*n(w.height),ded=(w.openings||[]).reduce((a,o)=>a+n(o.width)*n(o.height)*n(o.qty),0);return `<div class="wall-box"><div class="wall-head"><strong>${esc(w.name||'حائط '+(wi+1))} <span class="tag">صافي ${m2(Math.max(0,gross-ded))}</span></strong><button class="link-btn delete" data-action="delete-wall" data-room="${r.id}" data-wall="${w.id}">حذف الحائط</button></div><div class="inline-fields"><div class="field"><label class="label">اسم الحائط</label><input data-entity="wall" data-room="${r.id}" data-id="${w.id}" data-key="name" value="${esc(w.name||'')}"></div><div class="field"><label class="label">العرض (م)</label><input type="number" min="0" step="0.01" data-entity="wall" data-room="${r.id}" data-id="${w.id}" data-key="width" value="${esc(w.width)}"></div><div class="field"><label class="label">الارتفاع (م)</label><input type="number" min="0" step="0.01" data-entity="wall" data-room="${r.id}" data-id="${w.id}" data-key="height" value="${esc(w.height)}"></div></div><div class="subhead" style="margin-top:13px"><h4>الفتحات والخصم</h4><button class="btn sm" data-action="add-opening" data-room="${r.id}" data-wall="${w.id}">+ فتحة</button></div>${(w.openings||[]).length?`<div class="opening-list">${w.openings.map(o=>`<div class="opening-row"><select aria-label="نوع الفتحة" data-entity="opening" data-room="${r.id}" data-wall="${w.id}" data-id="${o.id}" data-key="type">${['باب','شباك','فتحة تهوية','فتحة أخرى'].map(t=>`<option ${o.type===t?'selected':''}>${t}</option>`).join('')}</select><input aria-label="عرض الفتحة" type="number" min="0" step="0.01" title="عرض الفتحة (م)" placeholder="العرض" data-entity="opening" data-room="${r.id}" data-wall="${w.id}" data-id="${o.id}" data-key="width" value="${esc(o.width)}"><input aria-label="ارتفاع الفتحة" type="number" min="0" step="0.01" title="ارتفاع الفتحة (م)" placeholder="الارتفاع" data-entity="opening" data-room="${r.id}" data-wall="${w.id}" data-id="${o.id}" data-key="height" value="${esc(o.height)}"><input aria-label="عدد الفتحات" type="number" min="1" step="1" title="عدد الفتحات المتطابقة" placeholder="العدد" data-entity="opening" data-room="${r.id}" data-wall="${w.id}" data-id="${o.id}" data-key="qty" value="${esc(o.qty)}"><button class="btn sm danger" data-action="delete-opening" data-room="${r.id}" data-wall="${w.id}" data-id="${o.id}" aria-label="حذف الفتحة">×</button></div>`).join('')}</div>`:`<p class="hint">لا توجد فتحات على هذا الحائط. أضف الباب أو الشباك ليُخصم من المسطح.</p>`}<p class="hint">إجمالي الخصم على الحائط: <strong>${m2(ded)}</strong></p></div>`}).join('')}</div></div>`}
function genericFormField(label,name,value='',type='text',placeholder='',extra=''){return `<div class="field"><label class="label">${label}</label><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${placeholder}" ${type==='number'?'min="0" step="0.01"':''} ${extra}></div>`}
function getEdited(module){const id=S.editing[module];return id?(S[module]||[]).find(r=>r.id===id)||null:null}
function formFooter(module,editing){return `<div class="form-actions"><button class="btn primary" type="submit">${editing?'حفظ التعديلات':'إضافة البند'}</button>${editing?btn('إلغاء','cancel-edit','btn','data-module="'+module+'"'):''}</div>`}
function floorArea(r){return Math.max(0,n(r.length))*Math.max(0,n(r.width))*Math.max(0,n(r.qty))}
function renderFloors(){const e=getEdited('floors'),mats=['رخام','سيراميك','بلاط','بورسلين','جرانيت','أخرى'];const total=S.floors.reduce((a,r)=>a+floorArea(r),0);return head('floors','أدخل أبعاد كل فراغ ونوع الأرضية؛ المساحة تُحسب تلقائيًا من الطول × العرض × العدد.')+`<div class="stats">${stat('عدد البنود',S.floors.length)}${stat('إجمالي المسطح',m2(total))}${stat('رخام',m2(S.floors.filter(x=>x.material==='رخام').reduce((a,r)=>a+floorArea(r),0)))}${stat('سيراميك وبلاط',m2(S.floors.filter(x=>['سيراميك','بلاط','بورسلين'].includes(x.material)).reduce((a,r)=>a+floorArea(r),0)))}</div><section class="card"><div class="card-head"><div><h3>${e?'تعديل بند أرضيات':'إضافة أرضية'}</h3><p>كل فراغ أو خامة مختلفة تُسجّل في بند مستقل.</p></div></div><form id="floorsForm"><div class="form-grid"><div class="field"><label class="label">المكان / الفراغ</label><input name="location" required value="${esc(e?.location||'')}" placeholder="مثال: حمام رئيسي"></div><div class="field"><label class="label">نوع الأرضية</label><select name="material">${mats.map(x=>`<option ${e?.material===x?'selected':''}>${x}</option>`).join('')}</select></div>${genericFormField('الطول (م)','length',e?.length??'','number','4.00','required')}${genericFormField('العرض (م)','width',e?.width??'','number','3.50','required')}${genericFormField('عدد المسطحات المتطابقة','qty',e?.qty??1,'number','1','required')}${genericFormField('ملاحظات','note',e?.note||'','text','مقاس البلاطة / نقشة...')}</div>${formFooter('floors',e)}</form></section><section class="card"><div class="card-head"><div><h3>بنود الأرضيات</h3><p>المساحة محسوبة بالمتر المربع.</p></div><span class="pill">${S.floors.length} بند</span></div>${S.floors.length?tableHtml(['المكان','الخامة','الطول','العرض','العدد','المساحة','ملاحظات'],S.floors.map(r=>[esc(r.location),`<span class="pill blue">${esc(r.material)}</span>`,fmt(r.length),fmt(r.width),fmt(r.qty),`<strong>${m2(floorArea(r))}</strong>`,esc(r.note||'')]),'floors'):empty('لا توجد أرضيات مسجلة بعد.')}</section>`}
function tableHtml(headers,rows,mod){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th>إجراءات</th></tr></thead><tbody>${rows.map((cells,i)=>`<tr>${cells.map(c=>`<td>${c}</td>`).join('')}<td class="td-actions">${btn('تعديل','edit-row','link-btn','data-module="'+mod+'" data-id="'+S[mod][i].id+'"')}${btn('حذف','delete-row','link-btn delete','data-module="'+mod+'" data-id="'+S[mod][i].id+'"')}</td></tr>`).join('')}</tbody></table></div>`}
function empty(text){return `<div class="empty"><span class="emoji">＋</span>${text}</div>`}
function doorsArea(r){return Math.max(0,n(r.width))*Math.max(0,n(r.height))*Math.max(0,n(r.qty))}
function renderDoors(){const e=getEdited('doorsWindows'),total=S.doorsWindows.reduce((a,r)=>a+doorsArea(r),0),qty=S.doorsWindows.reduce((a,r)=>a+n(r.qty),0);return head('doorsWindows','حصر الأبواب والشبابيك الخشبية والألوميتال بطريقة موحدة، مع المقاسات والعدد واتجاه الفتح.')+`<div class="stats">${stat('عدد البنود',S.doorsWindows.length)}${stat('إجمالي القطع',fmt(qty))}${stat('إجمالي المساحة',m2(total))}${stat('خشبي',fmt(S.doorsWindows.filter(r=>r.material==='خشب').reduce((a,r)=>a+n(r.qty),0))+' قطعة')}</div><section class="card"><div class="card-head"><div><h3>${e?'تعديل باب / شباك':'إضافة باب أو شباك'}</h3><p>تُحسب المساحة: العرض × الارتفاع × العدد. العدد يظل ظاهرًا بشكل مستقل عن المساحة.</p></div></div><form id="doorsWindowsForm"><div class="form-grid"><div class="field"><label class="label">الخامة</label><select name="material">${['ألوميتال','خشب','UPVC','أخرى'].map(x=>`<option ${e?.material===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label">النوع</label><select name="type">${['باب','شباك','باب بلكونة','شباك حمام','فتحة أخرى'].map(x=>`<option ${e?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label">المكان</label><input name="location" required value="${esc(e?.location||'')}" placeholder="شقة 3 - غرفة النوم"></div><div class="field"><label class="label">التشغيل</label><select name="operation">${['مفصلي','جرار','ثابت','قلاب','أكورديون','أخرى'].map(x=>`<option ${e?.operation===x?'selected':''}>${x}</option>`).join('')}</select></div>${genericFormField('العرض (م)','width',e?.width??'','number','0.90','required')}${genericFormField('الارتفاع (م)','height',e?.height??'','number','2.10','required')}${genericFormField('العدد','qty',e?.qty??1,'number','1','required') }<div class="field"><label class="label">اتجاه الفتح</label><select name="direction">${['يمين','شمال','بدون','غير محدد'].map(x=>`<option ${e?.direction===x?'selected':''}>${x}</option>`).join('')}</select></div>${genericFormField('ملاحظات','note',e?.note||'','text','لون / قطاع / ملاحظة')}</div>${formFooter('doorsWindows',e)}</form></section><section class="card"><div class="card-head"><div><h3>الأبواب والشبابيك المسجلة</h3><p>تستطيع جمع الخشب والألوميتال في نفس التقرير.</p></div><span class="pill">${S.doorsWindows.length} بند</span></div>${S.doorsWindows.length?tableHtml(['الخامة','النوع','المكان','التشغيل','العرض','الارتفاع','العدد','المساحة','اتجاه الفتح','ملاحظات'],S.doorsWindows.map(r=>[`<span class="pill ${r.material==='خشب'?'gold':'blue'}">${esc(r.material)}</span>`,esc(r.type),esc(r.location),esc(r.operation),fmt(r.width),fmt(r.height),fmt(r.qty),m2(doorsArea(r)),esc(r.direction),esc(r.note||'')]),'doorsWindows'):empty('أضف أبواب وشبابيك المشروع لتجميع العدد والمساحة.')}</section>`}

function stairQuantity(r){let q=0,u='m2',mode=r.mode||'auto',c=r.component||'درجة كاملة';const len=n(r.length),dep=n(r.depth),h=n(r.height),qty=n(r.qty);const mArea=c==='درجة كاملة'?len*(dep+h):c==='نائمة الدرجة'?len*dep:c==='قايمة'?len*h:c==='وزرة'?len*h:c==='تلبيس جانبي'?len*h:len*(dep||h);const autoUnit=c==='وزرة'?'lm':c==='بالعدد'?'count':'m2';if(mode==='count'){q=qty;u='count'}else if(mode==='lm'){q=len*qty;u='lm'}else if(mode==='m2'){q=mArea*qty;u='m2'}else{u=autoUnit;q=u==='lm'?len*qty:u==='count'?qty:mArea*qty}return {q:Math.max(0,q),unit:u}}

function facadeMath(f){let gross=n(f.width)*n(f.height),open=(f.openings||[]).reduce((a,o)=>a+n(o.width)*n(o.height)*n(o.qty),0);return {gross,open,net:Math.max(0,gross-open)}}

 const map={floors:'floors',doorsWindows:'doorsWindows',sanitary:'sanitary',stairs:'stairs',facades:'facades'};const module=map[id.replace('Form','')];if(!module)return;const v=fieldForm(form);let obj={...v};
 if(['floors','doorsWindows','stairs'].includes(module)){if(module==='floors'){obj.length=n(v.length);obj.width=n(v.width);obj.qty=n(v.qty);if(obj.length<=0||obj.width<=0||obj.qty<=0){showToast('تأكد من إدخال الطول والعرض والعدد.',true);return}}if(module==='doorsWindows'){obj.width=n(v.width);obj.height=n(v.height);obj.qty=n(v.qty);if(obj.width<=0||obj.height<=0||obj.qty<=0){showToast('تأكد من المقاسات والعدد.',true);return}}if(module==='stairs'){obj.length=n(v.length);obj.depth=n(v.depth);obj.height=n(v.height);obj.qty=n(v.qty);if(obj.length<=0||obj.qty<=0){showToast('أدخل طولًا وعددًا صحيحين.',true);return}}}
 if(module==='sanitary'){obj.qty=n(v.qty);obj.item=v.item;if(obj.qty<=0){showToast('العدد يجب أن يكون أكبر من صفر.',true);return}}
 if(module==='facades'){obj.width=n(v.width);obj.height=n(v.height);if(obj.width<=0||obj.height<=0){showToast('أدخل عرضًا وارتفاعًا أكبر من صفر.',true);return}}
 const edit=S.editing[module];if(edit){const idx=S[module].findIndex(x=>x.id===edit);if(idx>=0){if(module==='facades'){obj={...S[module][idx],...obj};}S[module][idx]={...S[module][idx],...obj,id:edit};}delete S.editing[module];showToast('تم حفظ التعديل.')}else{obj.id=uid();if(module==='facades'){obj.openings=[];obj.finishes=[];}S[module].push(obj);showToast('تمت إضافة البند بنجاح.')}render()}
document.addEventListener('submit',e=>{if(e.target.matches('#roomForm,#floorsForm,#doorsWindowsForm,#sanitaryForm,#stairsForm,#facadesForm')){e.preventDefault();doSubmit(e.target);return}const ff=e.target.closest('[data-finish-form]');if(ff){e.preventDefault();const f=S.facades.find(x=>x.id===ff.dataset.finishForm);if(!f)return;const v=fieldForm(ff);f.finishes.push({id:uid(),type:v.type,method:v.method,value:n(v.value)||100});render();showToast('تمت إضافة التشطيب للواجهة.')}});
document.addEventListener('input',e=>{const meta=e.target.dataset.meta;if(meta){S.meta[meta]=e.target.value;persist();}if(e.target.id==='projectName'){S.meta.project=e.target.value;persist()}});
document.addEventListener('change',e=>{const el=e.target; if(el.dataset.entity){const entity=el.dataset.entity,key=el.dataset.key,id=el.dataset.id;let target=null;if(entity==='wall'){const r=S.rooms.find(x=>x.id===el.dataset.room);target=r?.walls.find(x=>x.id===id)}else if(entity==='opening'){const r=S.rooms.find(x=>x.id===el.dataset.room),w=r?.walls.find(x=>x.id===el.dataset.wall);target=w?.openings.find(x=>x.id===id)}else if(entity==='facadeOpening'){const f=S.facades.find(x=>x.id===el.dataset.facade);target=f?.openings.find(x=>x.id===id)}else if(entity==='finish'){const f=S.facades.find(x=>x.id===el.dataset.facade);target=f?.finishes.find(x=>x.id===id)}if(target){target[key]=['width','height','qty','value'].includes(key)?n(el.value):el.value;persist();render()}return}if(el.dataset.meta){S.meta[el.dataset.meta]=el.value;persist()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,module=b.dataset.module;switch(a){case'navigate':S.ui.active=b.dataset.module;S.editing={};render();window.scrollTo({top:0,behavior:'smooth'});break;case'print':window.print();break;case'export-json':exportJson();break;case'import-json':$('#importFile').click();break;case'cancel-edit':delete S.editing[module];render();break;case'cancel-room':delete S.editing.room;render();break;case'edit-row':S.editing[module]=id;render();window.scrollTo({top:0,behavior:'smooth'});break;case'delete-row':if(confirm('تأكيد حذف هذا البند؟')){removeById(S[module],id);delete S.editing[module];render();showToast('تم حذف البند.')}break;case'toggle-room':S.ui.expandedRooms=S.ui.expandedRooms.includes(id)?S.ui.expandedRooms.filter(x=>x!==id):[...S.ui.expandedRooms,id];render();break;case'edit-room':S.editing.room=id;render();$('#roomForm')?.scrollIntoView({behavior:'smooth',block:'center'});break;case'delete-room':if(confirm('حذف الفراغ وكل الحوائط والفتحات التابعة له؟')){removeById(S.rooms,id);S.ui.expandedRooms=S.ui.expandedRooms.filter(x=>x!==id);render();showToast('تم حذف الفراغ.')}break;case'add-wall':{const r=S.rooms.find(x=>x.id===b.dataset.room);if(r){r.walls.push({id:uid(),name:'حائط '+(r.walls.length+1),width:n(r.length),height:n(r.height),openings:[]});S.ui.expandedRooms=[...new Set([...S.ui.expandedRooms,r.id])];render()}break}case'delete-wall':{const r=S.rooms.find(x=>x.id===b.dataset.room);if(r&&r.walls.length>1&&confirm('حذف الحائط وفتحات الخصم المرتبطة به؟')){removeById(r.walls,b.dataset.wall);render()}else if(r&&r.walls.length<=1)showToast('لا يمكن حذف آخر حائط بالفراغ.',true);break}case'add-opening':{const r=S.rooms.find(x=>x.id===b.dataset.room),w=r?.walls.find(x=>x.id===b.dataset.wall);if(w){addOpening(w);render()}break}case'delete-opening':{const r=S.rooms.find(x=>x.id===b.dataset.room),w=r?.walls.find(x=>x.id===b.dataset.wall);if(w){removeById(w.openings,b.dataset.id);render()}break}case'toggle-facade':S.ui.expandedFacades=S.ui.expandedFacades.includes(id)?S.ui.expandedFacades.filter(x=>x!==id):[...S.ui.expandedFacades,id];render();break;case'add-facade-opening':{const f=S.facades.find(x=>x.id===b.dataset.facade);if(f){addOpening(f,'شباك');S.ui.expandedFacades=[...new Set([...S.ui.expandedFacades,f.id])];render()}break}case'delete-facade-opening':{const f=S.facades.find(x=>x.id===b.dataset.facade);if(f){removeById(f.openings,b.dataset.id);render()}break}case'delete-finish':{const f=S.facades.find(x=>x.id===b.dataset.facade);if(f){removeById(f.finishes,b.dataset.id);render()}break}case'export-csv':exportCsv(S.ui.active);break;}}
);
function download(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function safeName(s){return (s||'BAND-حصر').replace(/[\\/:*?"<>|]/g,'-').slice(0,70)}
function exportJson(){const payload=JSON.stringify({...S,editing:{}},null,2);download(safeName(S.meta.project||'BAND-حصر')+'-backup.json',new Blob([payload],{type:'application/json;charset=utf-8'}));showToast('تم تجهيز النسخة الاحتياطية.')}
$('#importFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!Array.isArray(o.rooms)||!Array.isArray(o.floors))throw new Error();S={...defaultState(),...o,meta:{...defaultState().meta,...(o.meta||{})},ui:{...defaultState().ui,active:S.ui.active},editing:{}};['rooms','floors','doorsWindows','sanitary','stairs','facades'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});persist();render();showToast('تم استرجاع النسخة الاحتياطية.')}catch(err){showToast('الملف غير صالح أو ليس نسخة من BAND.',true)}};rd.readAsText(f);e.target.value=''});
function csvCell(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCsv(module){let heads=[],rows=[];if(['masonry','plaster','paint'].includes(module)){heads=['البند','الفراغ','نوع الفراغ','الحائط','عرض الحائط م','ارتفاع الحائط م','مساحة الحائط الإجمالية م²','خصم الفتحات م²','صافي الحائط م²','سقف م²','كمية البند م²','تفاصيل الفتحات'];S.rooms.forEach(r=>{(r.walls||[]).forEach(w=>{const gross=n(w.width)*n(w.height),opening=(w.openings||[]).reduce((a,o)=>a+n(o.width)*n(o.height)*n(o.qty),0),net=Math.max(0,gross-opening);rows.push([pageTitle(module),r.name,r.type,w.name,w.width,w.height,gross,opening,net,'',net,'']);});rows.push([pageTitle(module),r.name,r.type,'السقف',r.length,r.width,'','','',roomMath(r).ceiling,module==='masonry'?0:roomMath(r).ceiling,''])})}else if(module==='floors'){heads=['المكان','الخامة','الطول م','العرض م','العدد','المساحة م²','ملاحظات'];S.floors.forEach(r=>rows.push([r.location,r.material,r.length,r.width,r.qty,floorArea(r),r.note]))}else if(module==='doorsWindows'){heads=['الخامة','النوع','المكان','التشغيل','العرض م','الارتفاع م','العدد','المساحة م²','اتجاه الفتح','ملاحظات'];S.doorsWindows.forEach(r=>rows.push([r.material,r.type,r.location,r.operation,r.width,r.height,r.qty,doorsArea(r),r.direction,r.note]))}else if(module==='sanitary'){heads=['نوع الجهاز','المكان','العدد','الشركة/الموديل','ملاحظات'];S.sanitary.forEach(r=>rows.push([r.item==='أخرى'?(r.custom||'أخرى'):r.item,r.location,r.qty,r.brand,r.note]))}else if(module==='stairs'){heads=['المكون','المكان','طريقة الحصر','الطول م','عمق النائمة م','ارتفاع القائمة م','العدد','الكمية','الوحدة','ملاحظات'];S.stairs.forEach(r=>{const q=stairQuantity(r);rows.push([r.component,r.location,r.mode,r.length,r.depth,r.height,r.qty,q.q,unitLabel(q.unit),r.note])})}else if(module==='facades'){heads=['الواجهة','العرض م','الارتفاع م','المساحة الإجمالية م²','خصم الفتحات م²','صافي الواجهة م²','نوع التشطيب','طريقة الحساب','المساحة / النسبة','كمية التشطيب م²'];S.facades.forEach(f=>{const x=facadeMath(f);if(!f.finishes.length)rows.push([f.name,f.width,f.height,x.gross,x.open,x.net,'','','','']);f.finishes.forEach(fin=>rows.push([f.name,f.width,f.height,x.gross,x.open,x.net,fin.type,fin.method,fin.value,finishArea(f,fin)]))})}else{showToast('اختر بند حصر أولًا لتصدير كشفه.',true);return}const csv='\ufeff'+[heads,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');download(safeName(S.meta.project||'BAND')+'-'+safeName(pageTitle(module))+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));showToast('تم تصدير الكشف بصيغة CSV المتوافقة مع Excel.')}
// Inject export for the currently selected measurement section into its page tools after initial render.
const originalHead=head; // kept as a fallback; buttons added once to each non-home page after rendering.
const observer=new MutationObserver(()=>{const h=$('#content .head-actions');if(h&&S.ui.active!=='home'&&!h.querySelector('[data-action="export-csv"]'))h.insertAdjacentHTML('beforeend',btn('تصدير Excel / CSV','export-csv','btn',''));});observer.observe($('#content'),{childList:true,subtree:true});
render();
